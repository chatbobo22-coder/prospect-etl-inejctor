name: Source Connectivity

on:
  push:
    branches: [main]
    paths:
      - "src/cnpj_etl/source.py"
      - "tests/test_source.py"
      - ".github/workflows/source-connectivity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receita:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe public share page
        continue-on-error: true
        run: >-
          curl --fail --silent --show-error --location --max-time 30
          --output /dev/null
          https://arquivos.receitafederal.gov.br/index.php/s/YggdBLfdninEJX9

      - name: Probe public file with browser headers
        continue-on-error: true
        run: >-
          curl --fail --silent --show-error --location --max-time 30
          --range 0-0 --output /dev/null
          --header 'X-Requested-With: XMLHttpRequest'
          --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          https://arquivos.receitafederal.gov.br/public.php/dav/files/YggdBLfdninEJX9/2026-09/Cnaes.zip

      - name: Probe public file over IPv4
        continue-on-error: true
        run: >-
          curl --ipv4 --fail --silent --show-error --location --max-time 30
          --range 0-0 --output /dev/null
          https://arquivos.receitafederal.gov.br/public.php/dav/files/YggdBLfdninEJX9/2026-09/Cnaes.zip

      - name: Probe legacy file route
        continue-on-error: true
        run: >-
          curl --fail --silent --show-error --location --max-time 30
          --range 0-0 --output /dev/null --user 'YggdBLfdninEJX9:'
          https://arquivos.receitafederal.gov.br/public.php/webdav/2026-09/Cnaes.zip

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install .

      - name: Verify Receita source without loading data
        run: |
          python - <<'PY'
          from cnpj_etl.source import RfbSource

          source = RfbSource(
              "https://arquivos.receitafederal.gov.br/index.php/s/YggdBLfdninEJX9",
              timeout=30,
          )
          competence = source.latest_competence()
          files = source.list_files(competence)
          size, modified = source.metadata(files[0])
          print(
              f"source_ok competence={competence} files={len(files)} "
              f"first_size={size} modified={modified}"
          )
          PY
