name: Source Connectivity

on:
  push:
    branches: [main]
    paths:
      - "src/cnpj_etl/source.py"
      - "tests/test_source.py"
      - ".github/workflows/source-connectivity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receita:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install .

      - name: Verify Receita source without loading data
        run: |
          python - <<'PY'
          import zipfile

          from cnpj_etl.source import RfbSource

          source = RfbSource(
              "https://arquivos.receitafederal.gov.br/index.php/s/YggdBLfdninEJX9",
              timeout=30,
              mirror_url="https://dados-abertos-rf-cnpj.casadosdados.com.br/arquivos/",
          )
          competence = source.latest_competence()
          files = source.list_files(competence)
          with source.temporary_download(files[0], 1024 * 1024) as (path, digest, size):
              assert zipfile.is_zipfile(path)
              print(
                  f"source_ok competence={competence} files={len(files)} "
                  f"first_size={size} sha256={digest[:12]}"
              )
          PY
