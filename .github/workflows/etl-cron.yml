name: CNPJ ETL

env:
  SQL_DIR: ${{ github.workspace }}/sql

on:
  # Mantido apenas para recuperação manual. O prospect-pipeline encadeia os
  # lotes continuamente e evita duas cargas concorrentes no mesmo banco.
  workflow_dispatch:
    inputs:
      competence:
        description: "Competência YYYY-MM (vazio = mais recente)"
        required: false
        type: string
      force:
        description: "Reprocessa ZIPs e incrementa base (não apaga dados existentes)"
        required: false
        type: boolean
        default: false
      full_reload:
        description: "APAGA tudo e recarrega do zero (só se quiser zerar a base)"
        required: false
        type: boolean
        default: false

concurrency:
  group: cnpj-enrichment-write
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load DATABASE_URL
        env:
          SECRET_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VAR_DATABASE_URL: ${{ vars.DATABASE_URL }}
        run: |
          if [ -n "${SECRET_DATABASE_URL:-}" ]; then
            echo "DATABASE_URL=${SECRET_DATABASE_URL}" >> "$GITHUB_ENV"
            echo "Repository secret DATABASE_URL OK."
          elif [ -n "${VAR_DATABASE_URL:-}" ]; then
            echo "DATABASE_URL=${VAR_DATABASE_URL}" >> "$GITHUB_ENV"
            echo "Repository variable DATABASE_URL OK."
          else
            echo "::error::DATABASE_URL não encontrado em Repository secrets/variables."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install .

      - name: Configure ETL filters
        run: |
          echo "FILTER_ACTIVE_ONLY=true" >> "$GITHUB_ENV"
          echo "FILTER_REQUIRE_NOME_FANTASIA=false" >> "$GITHUB_ENV"
          echo "FILTER_REQUIRE_TELEFONE=false" >> "$GITHUB_ENV"
          echo "FILTER_REQUIRE_EMAIL=true" >> "$GITHUB_ENV"
          echo "FILTER_BLOCK_BACKOFFICE_EMAIL=true" >> "$GITHUB_ENV"
          echo "FILTER_HEADQUARTERS_ONLY=true" >> "$GITHUB_ENV"
          echo "FILTER_MAX_CANDIDATES_PER_RUN=12000" >> "$GITHUB_ENV"
          echo "FILTER_MIN_ACTIVITY_MONTHS=12" >> "$GITHUB_ENV"
          echo "FILTER_MIN_POPULATION=0" >> "$GITHUB_ENV"
          echo "CHUNK_SIZE=5000" >> "$GITHUB_ENV"
          echo "IBGE_POPULATION_YEAR=2024" >> "$GITHUB_ENV"
          echo "FILTER_CNAE_INCLUDE_SECONDARY=true" >> "$GITHUB_ENV"
          echo "FILTER_CNAES=" >> "$GITHUB_ENV"
          # Carga nacional — não aplicar FILTER_UF mesmo se existir nos variables do GitHub

      - name: Check database connection
        run: python -m cnpj_etl.cli check-db

      - name: Migrate and sync IBGE population
        run: python -m cnpj_etl.cli sync-ibge

      - name: Verify filters
        run: python -m cnpj_etl.cli verify-filters

      - name: Reset load (full reload)
        if: inputs.full_reload == true
        run: python -m cnpj_etl.cli reset-load --yes

      - name: Run ETL
        env:
          KEEP_DOWNLOADS: "false"
        run: |
          args="--auto"
          if [ -n "${{ inputs.competence }}" ]; then
            args="$args --competence ${{ inputs.competence }}"
          fi
          if [ "${{ inputs.force }}" = "true" ] || [ "${{ inputs.full_reload }}" = "true" ]; then
            args="$args --force"
          fi
          python -m cnpj_etl.cli run $args

      - name: Publish ready A/B leads to Outreach
        run: python -m cnpj_etl.cli publish-ready
