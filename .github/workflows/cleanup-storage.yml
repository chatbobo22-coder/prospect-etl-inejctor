name: Liberar armazenamento do Injector

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cnpj-storage-maintenance
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SQL_DIR: ${{ github.workspace }}/sql
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Remover intermediários e compactar
        run: python -m cnpj_etl.cli cleanup-storage
