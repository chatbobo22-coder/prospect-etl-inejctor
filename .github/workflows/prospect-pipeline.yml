name: Prospect Pipeline

env:
  SQL_DIR: ${{ github.workspace }}/sql

permissions:
  actions: write
  contents: read

on:
  schedule:
    # Diário às 03:00 UTC (00:00 BRT)
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      competence:
        description: "Competência YYYY-MM (vazio = mais recente)"
        required: false
        type: string
      filter_cnaes:
        description: "CNAEs separados por vírgula (vazio = todos)"
        required: false
        type: string
      active_only:
        description: "Somente estabelecimentos ativos"
        required: false
        type: boolean
        default: true
      include_secondary_cnae:
        description: "Considerar CNAEs secundários"
        required: false
        type: boolean
        default: true
      require_nome_fantasia:
        description: "Exigir nome fantasia"
        required: false
        type: boolean
        default: false
      require_telefone:
        description: "Exigir telefone"
        required: false
        type: boolean
        default: false
      require_email:
        description: "Exigir e-mail válido"
        required: false
        type: boolean
        default: true
      block_backoffice_email:
        description: "Bloquear e-mails contábeis, fiscais, NFe, RH e cobrança"
        required: false
        type: boolean
        default: true
      min_activity_months:
        description: "Tempo mínimo de atividade da empresa em meses"
        required: false
        type: string
        default: "12"
      min_population:
        description: "População mínima do município"
        required: false
        type: string
        default: "0"
      exclude_mei:
        description: "Excluir empresas MEI da lista final"
        required: false
        type: boolean
        default: true
      min_confidence_score:
        description: "Confiança mínima para qualidade A/B"
        required: false
        type: string
        default: "70"
      min_lead_score:
        description: "Pontuação mínima para qualidade A/B"
        required: false
        type: string
        default: "70"
      load_batch_size:
        description: "Candidatos brutos por ciclo antes da triagem"
        required: false
        type: string
        default: "12000"
      force_etl:
        description: "Reprocessa ZIPs da Receita (incrementa base, não apaga)"
        required: false
        type: boolean
        default: true
      continuous:
        description: "Inicia automaticamente o próximo lote após concluir"
        required: false
        type: boolean
        default: true
      force_enrich:
        description: "Reprocessa enriquecimento digital de todos os candidatos"
        required: false
        type: boolean
        default: false
      enrich_batch_size:
        description: "CNPJs por rodada de enriquecimento"
        required: false
        type: string
        default: "500"
      intelligence_sources:
        description: "Fontes de inteligência separadas por vírgula"
        required: false
        type: string
        default: "receita,email_quality,website,rdap,cvm,gdelt"
      intelligence_batch_size:
        description: "Empresas consultadas por fonte e por execução"
        required: false
        type: string
        default: "250"

concurrency:
  group: cnpj-enrichment-write
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
      PROSPEO_API_KEY: ${{ secrets.PROSPEO_API_KEY }}
      HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load DATABASE_URL
        env:
          SECRET_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VAR_DATABASE_URL: ${{ vars.DATABASE_URL }}
        run: |
          if [ -n "${SECRET_DATABASE_URL:-}" ]; then
            echo "DATABASE_URL=${SECRET_DATABASE_URL}" >> "$GITHUB_ENV"
          elif [ -n "${VAR_DATABASE_URL:-}" ]; then
            echo "DATABASE_URL=${VAR_DATABASE_URL}" >> "$GITHUB_ENV"
          else
            echo "::error::DATABASE_URL não encontrado."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install .

      - name: Configure pipeline (carga ampla + enriquecimento máximo)
        env:
          SPEEDIO_KEY: ${{ secrets.ENRICH_EXTERNAL_API_KEY }}
        run: |
          echo "FILTER_ACTIVE_ONLY=${{ inputs.active_only != false }}" >> "$GITHUB_ENV"
          echo "FILTER_REQUIRE_NOME_FANTASIA=${{ inputs.require_nome_fantasia == true }}" >> "$GITHUB_ENV"
          echo "FILTER_REQUIRE_TELEFONE=${{ inputs.require_telefone == true }}" >> "$GITHUB_ENV"
          echo "FILTER_REQUIRE_EMAIL=${{ inputs.require_email != false }}" >> "$GITHUB_ENV"
          echo "FILTER_BLOCK_BACKOFFICE_EMAIL=${{ inputs.block_backoffice_email != false }}" >> "$GITHUB_ENV"
          echo "FILTER_HEADQUARTERS_ONLY=true" >> "$GITHUB_ENV"
          echo "FILTER_MAX_CANDIDATES_PER_RUN=${{ inputs.load_batch_size || '12000' }}" >> "$GITHUB_ENV"
          echo "FILTER_MIN_ACTIVITY_MONTHS=${{ inputs.min_activity_months || '12' }}" >> "$GITHUB_ENV"
          echo "FILTER_MIN_POPULATION=${{ inputs.min_population || '0' }}" >> "$GITHUB_ENV"
          echo "CHUNK_SIZE=5000" >> "$GITHUB_ENV"
          echo "FILTER_CNAE_INCLUDE_SECONDARY=${{ github.event_name == 'schedule' || inputs.include_secondary_cnae == true }}" >> "$GITHUB_ENV"
          echo "IBGE_POPULATION_YEAR=2024" >> "$GITHUB_ENV"
          echo "ENRICH_CANDIDATE_VIEW=cnpj.v_prospect_candidates" >> "$GITHUB_ENV"
          echo "ENRICH_BATCH_SIZE=${{ inputs.enrich_batch_size || '500' }}" >> "$GITHUB_ENV"
          echo "ENRICH_MAX_ROUNDS=40" >> "$GITHUB_ENV"
          echo "ENRICH_BRASILAPI=false" >> "$GITHUB_ENV"
          echo "ENRICH_DELAY_SECONDS=0.05" >> "$GITHUB_ENV"
          echo "ENRICH_REQUEST_TIMEOUT=8" >> "$GITHUB_ENV"
          echo "PROSPECT_MIN_CONFIDENCE_SCORE=${{ inputs.min_confidence_score || '70' }}" >> "$GITHUB_ENV"
          echo "PROSPECT_MIN_LEAD_SCORE=${{ inputs.min_lead_score || '70' }}" >> "$GITHUB_ENV"
          echo "INTELLIGENCE_MIN_LEAD_SCORE=${{ inputs.min_lead_score || '70' }}" >> "$GITHUB_ENV"
          echo "REJECTED_REVIEW_DAYS=180" >> "$GITHUB_ENV"
          echo "PROSPECT_EXCLUDE_MEI=${{ inputs.exclude_mei != false }}" >> "$GITHUB_ENV"
          echo "ENRICHMENT_VERSION=v2" >> "$GITHUB_ENV"
          echo "ENRICH_NO_SITE_RETRY_DAYS=30" >> "$GITHUB_ENV"
          echo "CRAWLER_MAX_PAGES=3" >> "$GITHUB_ENV"
          echo "GOOGLE_PLACES_ENABLED=false" >> "$GITHUB_ENV"
          sources="${{ inputs.intelligence_sources || 'receita,email_quality,website,rdap,cvm,gdelt' }}"
          for provider in apollo prospeo hunter; do
            key_name="${provider^^}_API_KEY"
            if [ -n "${!key_name:-}" ] && [[ ",$sources," != *",$provider,"* ]]; then
              sources="$sources,$provider"
            fi
          done
          echo "INTELLIGENCE_SOURCES=$sources" >> "$GITHUB_ENV"
          # GDELT/CVM enriquecem o perfil, mas não seguram um lead digital A/B.
          echo "STRICT_INTELLIGENCE_GATE=false" >> "$GITHUB_ENV"
          echo "INTELLIGENCE_BATCH_SIZE=${{ inputs.intelligence_batch_size || '250' }}" >> "$GITHUB_ENV"
          echo "PEOPLE_PROVIDER_BATCH_SIZE=10" >> "$GITHUB_ENV"
          echo "PEOPLE_PROVIDER_LIMIT=3" >> "$GITHUB_ENV"
          echo "PEOPLE_PROVIDER_REVEAL_EMAILS=true" >> "$GITHUB_ENV"
          echo "PEOPLE_PROVIDER_REVEAL_PHONES=false" >> "$GITHUB_ENV"
          echo "INTELLIGENCE_DELAY_SECONDS=0.05" >> "$GITHUB_ENV"
          echo "INTELLIGENCE_MAX_ROUNDS=40" >> "$GITHUB_ENV"
          echo "GDELT_TIMEOUT_SECONDS=12" >> "$GITHUB_ENV"
          echo "GDELT_BATCH_SIZE=25" >> "$GITHUB_ENV"
          echo "GDELT_DELAY_SECONDS=5.2" >> "$GITHUB_ENV"
          echo "GDELT_CIRCUIT_BREAKER_ERRORS=3" >> "$GITHUB_ENV"
          if [ -n "${{ secrets.GOOGLE_PLACES_API_KEY }}" ]; then
            echo "GOOGLE_PLACES_ENABLED=true" >> "$GITHUB_ENV"
            echo "GOOGLE_PLACES_API_KEY=${{ secrets.GOOGLE_PLACES_API_KEY }}" >> "$GITHUB_ENV"
            echo "GOOGLE_PLACES_MAX_REQUESTS_PER_RUN=500" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ inputs.filter_cnaes }}" ]; then
            echo "FILTER_CNAES=${{ inputs.filter_cnaes }}" >> "$GITHUB_ENV"
          else
            echo "FILTER_CNAES=" >> "$GITHUB_ENV"
          fi
          if [ -n "${SPEEDIO_KEY:-}" ]; then
            echo "ENRICH_EXTERNAL_API_KEY=${SPEEDIO_KEY}" >> "$GITHUB_ENV"
            echo "ENRICH_EXTERNAL_API_PROVIDER=speedio" >> "$GITHUB_ENV"
          fi

      - name: Migrate and sync IBGE
        run: python -m cnpj_etl.cli sync-ibge

      - name: Run ETL (carga ampla varejo ativo)
        env:
          KEEP_DOWNLOADS: "false"
        run: |
          args="--auto"
          if [ -n "${{ inputs.competence }}" ]; then
            args="$args --competence ${{ inputs.competence }}"
          fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.force_etl }}" = "true" ]; then
            args="$args --force"
          fi
          python -m cnpj_etl.cli run $args

      - name: Enrich + qualify prospects
        run: |
          args=""
          if [ "${{ inputs.force_enrich }}" = "true" ]; then
            args="--force-enrich"
          fi
          python -m cnpj_etl.cli prospect-pipeline $args

      - name: Sync qualified A/B leads to Outreach
        run: python -m cnpj_etl.cli sync-outreach

      - name: Summary counts
        run: |
          python - <<'PY'
          import os
          import psycopg
          url = os.environ["DATABASE_URL"]
          with psycopg.connect(url) as conn:
              est = conn.execute("SELECT COUNT(*) FROM cnpj.estabelecimentos").fetchone()[0]
              cand = conn.execute("SELECT COUNT(*) FROM cnpj.v_prospect_candidates").fetchone()[0]
              enriched = conn.execute(
                  "SELECT COUNT(*) FROM cnpj.digital_presenca WHERE enrich_status IN ('done','partial')"
              ).fetchone()[0]
              sites_valid = conn.execute(
                  "SELECT COUNT(*) FROM cnpj.digital_presenca WHERE site_valid = true"
              ).fetchone()[0]
              ecommerce_conf = conn.execute(
                  "SELECT COUNT(*) FROM cnpj.digital_presenca WHERE commerce_maturity = 'ecommerce_confirmado'"
              ).fetchone()[0]
              whatsapp_conf = conn.execute(
                  "SELECT COUNT(*) FROM cnpj.digital_presenca WHERE whatsapp_valid = true"
              ).fetchone()[0]
              qualified = conn.execute(
                  "SELECT COUNT(*) FROM cnpj.prospectos_qualificados WHERE qualification_status = 'qualified'"
              ).fetchone()[0]
              review = conn.execute(
                  "SELECT COUNT(*) FROM cnpj.prospectos_qualificados WHERE qualification_status = 'review_required'"
              ).fetchone()[0]
              rejected = conn.execute(
                  "SELECT COUNT(*) FROM etl.candidate_decisions WHERE decision = 'rejected'"
              ).fetchone()[0]
              outreach = conn.execute(
                  "SELECT COUNT(*) FROM outreach.leads WHERE source = 'cnpj_etl'"
              ).fetchone()[0]
              gplaces = conn.execute(
                  "SELECT COALESCE(SUM(google_places_requests),0) FROM etl.enrichment_runs "
                  "WHERE started_at > now() - interval '1 day'"
              ).fetchone()[0]
          print(f"estabelecimentos={est}")
          print(f"candidatos_varejo={cand}")
          print(f"enriquecidos={enriched}")
          print(f"sites_validados={sites_valid}")
          print(f"ecommerce_confirmado={ecommerce_conf}")
          print(f"whatsapp_confirmado={whatsapp_conf}")
          print(f"qualificados={qualified}")
          print(f"review_required={review}")
          print(f"rejeitados={rejected}")
          print(f"sincronizados_outreach={outreach}")
          print(f"google_places_requests_24h={gplaces}")
          PY

      - name: Check whether another batch exists
        id: next_batch
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.continuous == true }}
        env:
          LOAD_BATCH_SIZE: ${{ inputs.load_batch_size || '12000' }}
        run: |
          python - <<'PY'
          import os
          import psycopg

          batch_size = int(os.environ["LOAD_BATCH_SIZE"])
          with psycopg.connect(os.environ["DATABASE_URL"]) as conn:
              competence = conn.execute(
                  "SELECT competence FROM etl.runs ORDER BY id DESC LIMIT 1"
              ).fetchone()[0]
              loaded = conn.execute(
                  "SELECT COALESCE(SUM(rows_processed),0) FROM etl.files "
                  "WHERE competence=%s AND file_type='Estabelecimentos'",
                  (competence,),
              ).fetchone()[0]
          should_continue = int(loaded) >= batch_size
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"continue={'true' if should_continue else 'false'}\n")
          print(f"lote_estabelecimentos={loaded} limite={batch_size} continuar={should_continue}")
          PY

      - name: Queue next continuous batch
        if: ${{ steps.next_batch.outputs.continue == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run prospect-pipeline.yml \
            --ref "${{ github.ref_name }}" \
            -f competence="${{ inputs.competence }}" \
            -f filter_cnaes="${{ inputs.filter_cnaes }}" \
            -f active_only="${{ inputs.active_only }}" \
            -f include_secondary_cnae="${{ inputs.include_secondary_cnae }}" \
            -f require_nome_fantasia="${{ inputs.require_nome_fantasia }}" \
            -f require_telefone="${{ inputs.require_telefone }}" \
            -f require_email="${{ inputs.require_email }}" \
            -f block_backoffice_email="${{ inputs.block_backoffice_email }}" \
            -f min_activity_months="${{ inputs.min_activity_months }}" \
            -f min_population="${{ inputs.min_population }}" \
            -f exclude_mei="${{ inputs.exclude_mei }}" \
            -f min_confidence_score="${{ inputs.min_confidence_score }}" \
            -f min_lead_score="${{ inputs.min_lead_score }}" \
            -f load_batch_size="${{ inputs.load_batch_size }}" \
            -f force_etl=true \
            -f continuous=true \
            -f force_enrich=false \
            -f enrich_batch_size="${{ inputs.enrich_batch_size }}" \
            -f intelligence_sources="${{ inputs.intelligence_sources }}" \
            -f intelligence_batch_size="${{ inputs.intelligence_batch_size }}"
