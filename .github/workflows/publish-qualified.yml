name: Publicar leads qualificados

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: outreach-qualified-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SQL_DIR: ${{ github.workspace }}/sql
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Recalibrar scores, promover A/B e publicar
        run: python -m cnpj_etl.cli refresh-quality
      - name: Resumo
        run: |
          echo "Leads qualificados sincronizados sem interromper o Injector." >> "$GITHUB_STEP_SUMMARY"
